[pytest]
asyncio_mode = auto
# Motor binds its client to the loop that created it, so fixtures and tests must
# share one session-scoped loop or every DB call fails with "different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:reportlab.*
markers =
    slow: exercises real model inference
