services:
  mongo:
    image: mongo:7
    container_name: designeye-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume: data must survive `docker compose down`.
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: designeye-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Set INSTALL_LLM_SDKS=true in .env to bake in the real provider SDKs.
        INSTALL_LLM_SDKS: ${INSTALL_LLM_SDKS:-false}
    container_name: designeye-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      # Inference runs inline so the stack is usable even without the worker.
      DEV_MODE: "${DEV_MODE:-true}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,chrome-extension://illaijihjmgpodgbpbpiagnaplnjbdnf}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: designeye
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env at the repo root}
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /app/storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      MODEL_PATH: app/ml/weights/stage3_ui_best_val.pth
      MODEL_VERSION: stage3-ui-v1
      MAX_UPLOAD_MB: "10"
      MAX_PDF_UPLOAD_MB: "20"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Weights are gitignored and never baked into the image.
      - ./backend/app/ml/weights:/app/app/ml/weights:ro
      - storage_data:/app/storage
      # Optional: lets `python -m app.seed` use the real Visily screens instead
      # of generated placeholders. The seeder falls back if this is absent.
      - ./inputs:/inputs:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_LLM_SDKS: ${INSTALL_LLM_SDKS:-false}
    container_name: designeye-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    # The image's default healthcheck curls the API's HTTP port, which this
    # service never opens -- it would report unhealthy forever. Ask Celery
    # instead. start_period covers loading the 99MB checkpoint.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    environment:
      APP_ENV: production
      DEV_MODE: "false"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: designeye
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env at the repo root}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /app/storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      MODEL_PATH: app/ml/weights/stage3_ui_best_val.pth
      MODEL_VERSION: stage3-ui-v1
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - ./backend/app/ml/weights:/app/app/ml/weights:ro
      - storage_data:/app/storage
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: designeye-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  storage_data:
